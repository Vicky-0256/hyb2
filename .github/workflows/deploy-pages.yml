name: Deploy HYB2 Web Lite

on:
  push:
    branches:
      - main
    paths:
      - ".gitattributes"
      - "web/**"
      - "desktop/**"
      - "pipeline/**"
      - "third_party/cplfold/**"
      - "third_party/iris/**"
      - "bin/cplfold"
      - "bin/plot_hybrids_3.awk"
      - "scripts/bundle_sources.py"
      - "scripts/build-*.sh"
      - "scripts/pyodide-build-requirements.txt"
      - "scripts/pyodide-toolchain.env"
      - "scripts/verify-*.cjs"
      - "scripts/verify-*.mjs"
      - "scripts/verify-browser-release.sh"
      - "scripts/json-schema-lite.cjs"
      - "scripts/write-releases.mjs"
      - "scripts/webr-smoke/**"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/desktop-release.yml"
      - ".github/workflows/publish-desktop.yml"
      - ".github/workflows/release-gate.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  desktop:
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-release.yml

  build:
    runs-on: ubuntu-latest
    outputs:
      pages_artifact_id: ${{ steps.pages-artifact.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Record build provenance
        run: |
          printf 'window.HYB2_BUILD = { commit: "%s" };\n' "$GITHUB_SHA" > web/build-info.js

      - name: Read published desktop releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/write-releases.mjs

      - name: Build pinned ViennaRNA WebAssembly engine
        env:
          EMSDK_VERSION: 3.1.57
        run: |
          hyb2_emsdk_directory="$RUNNER_TEMP/hyb2-emsdk"
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$hyb2_emsdk_directory"
          "$hyb2_emsdk_directory/emsdk" install "$EMSDK_VERSION"
          "$hyb2_emsdk_directory/emsdk" activate "$EMSDK_VERSION"
          source "$hyb2_emsdk_directory/emsdk_env.sh"
          bash scripts/build-vienna-wasm.sh
          node scripts/verify-iris-core.cjs
          node scripts/verify-iris-worker.cjs
          node scripts/verify-iris-ui.cjs
          node scripts/verify-cplcofold-ui.cjs

      - name: Verify static application
        run: |
          test -f web/index.html
          test -s web/build-info.js
          test -s web/vendor/viennarna/vienna-rna.js
          test -s web/vendor/viennarna/vienna-rna.wasm
          test -s web/vendor/viennarna/COPYING-ViennaRNA.txt
          for file in web/*.js; do
            node --check "$file"
          done
          node --check scripts/webr-smoke/spike.mjs
          node --check web/cplfold.worker.mjs
          node scripts/verify-parser.cjs
          node scripts/verify-comrades-analysis.cjs
          node scripts/verify-webr-feasibility.cjs
          node scripts/verify-input-select-events.cjs
          node scripts/verify-motion-contract.cjs
          node scripts/verify-evidence.cjs
          node scripts/verify-report-render.cjs
          node scripts/verify-results.cjs
          node scripts/verify-ui-kit.cjs
          node scripts/verify-deseq.cjs
          node scripts/verify-arc-map.cjs
          node scripts/verify-region-panels.cjs
          # runs after the ViennaRNA build above, so RNAcofold is checked too
          node scripts/verify-folding-energy.cjs
          node scripts/verify-batch-tools.cjs
          # the included example end to end (~15 s): Compare maps, differential
          # test, arc map, regions and RNAcofold energies vs the R pipeline
          node scripts/verify-example.cjs

      - name: Set up Python 3.13 for the Pyodide build
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Cache the Pyodide build toolchain
        uses: actions/cache@v4
        with:
          path: |
            .build-tools/pyodide-venv
            .build-tools/pyodide-xbuildenv
          # the exact Python (the venv links to it) and the pins only, so an
          # edit elsewhere in the build script keeps the cache
          key: pyodide-toolchain-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('scripts/pyodide-toolchain.env', 'scripts/pyodide-build-requirements.txt') }}
      - name: Build the ViennaRNA Pyodide wheel
        run: |
          HYB2_PYTHON313="$(command -v python3.13 || command -v python3)" bash scripts/build-vienna-pyodide.sh

      - name: Build and verify pinned browser CPLfold runtime
        run: |
          bash scripts/build-cplfold-web.sh
          test -s web/vendor/pyodide-cplfold/pyodide.mjs
          test -s web/vendor/pyodide-cplfold/pyodide.asm.wasm
          test -s web/vendor/pyodide-cplfold/numpy-2.2.5-cp313-cp313-pyemscripten_2025_0_wasm32.whl
          test -s web/vendor/pyodide-cplfold/CPLfold-THIRD_PARTY_NOTICES.md
          test -s web/vendor/pyodide-cplfold/CPLfold-GPL-2.0-or-later.txt
          test -s web/vendor/pyodide-cplfold/CPLfold-LinearFold-LICENSE.txt
          bash scripts/verify-browser-release.sh
          node scripts/verify-cplfold-parameters.mjs
          node scripts/verify-cplcofold-local-regions.mjs

      - name: Version static assets for browser cache refresh
        run: |
          releases_hash=$(sha256sum web/releases.js | cut -d ' ' -f 1)
          sed -i "s#\./releases\.js\"#./releases.js?build=${releases_hash}\"#" web/index.html
          sed -i -E "s#(\./[^\"?]+\.(css|js))\"#\1?build=${GITHUB_SHA}\"#g" web/index.html
          grep -Fq "releases.js?build=${releases_hash}" web/index.html
          grep -q "app.js?build=${GITHUB_SHA}" web/index.html
          grep -q "styles.css?build=${GITHUB_SHA}" web/index.html

      - name: Configure GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' && vars.CPLFOLD_DISTRIBUTION_APPROVED == 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        id: pages-artifact
        if: ${{ github.ref == 'refs/heads/main' && vars.CPLFOLD_DISTRIBUTION_APPROVED == 'true' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./web
          retention-days: 1

      - name: Explain release gate
        if: ${{ vars.CPLFOLD_DISTRIBUTION_APPROVED != 'true' }}
        run: |
          echo "CPLfold browser build verified, but publishing is disabled." >> "$GITHUB_STEP_SUMMARY"
          echo "Set the repository Actions variable CPLFOLD_DISTRIBUTION_APPROVED=true only after redistribution permission or qualified licence review." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: ${{ github.ref == 'refs/heads/main' && vars.CPLFOLD_DISTRIBUTION_APPROVED == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, desktop]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Remove the temporary artifact after deployment
        if: ${{ success() && needs.build.outputs.pages_artifact_id != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.pages_artifact_id }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
