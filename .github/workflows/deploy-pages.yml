name: Deploy HYB2 Web Lite

on:
  push:
    branches:
      - main
      - integration/unified-release
    paths:
      - ".gitattributes"
      - "web/**"
      - "desktop/**"
      - "pipeline/**"
      - "third_party/**"
      - "bin/**"
      - "data/**"
      - "requirements/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: "Prepare a Pages artifact for this invoking release tag"
        type: string
      browser_only:
        description: "The caller schedules native package checks separately"
        type: boolean
    outputs:
      pages_artifact_id:
        value: ${{ jobs.build.outputs.pages_artifact_id }}
      pages_artifact_name:
        value: ${{ jobs.build.outputs.pages_artifact_name }}

permissions:
  contents: read

jobs:
  desktop:
    if: ${{ !inputs.browser_only }}
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-release.yml

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    outputs:
      pages_artifact_id: ${{ steps.pages-artifact.outputs.artifact_id }}
      pages_artifact_name: ${{ steps.site.outputs.name }}
      release_catalog_sha256: ${{ steps.releases.outputs.sha256 }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Record event commit and primary tag
        id: site
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node -e 'console.log("window.HYB2_BUILD = " + JSON.stringify({commit: process.env.GITHUB_SHA, releaseTag: process.env.RELEASE_TAG}) + ";")' > web/build-info.js
          echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Read published desktop releases
        id: releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/write-releases.mjs
          echo "sha256=$(sha256sum web/releases.js | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Build pinned ViennaRNA WebAssembly engine
        env:
          EMSDK_VERSION: 3.1.57
        run: |
          hyb2_emsdk_directory="$RUNNER_TEMP/hyb2-emsdk"
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$hyb2_emsdk_directory"
          "$hyb2_emsdk_directory/emsdk" install "$EMSDK_VERSION"
          "$hyb2_emsdk_directory/emsdk" activate "$EMSDK_VERSION"
          source "$hyb2_emsdk_directory/emsdk_env.sh"
          bash scripts/build-vienna-wasm.sh

      - name: Set up Python 3.13 for the Pyodide build
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Cache the Pyodide build toolchain
        uses: actions/cache@v4
        with:
          path: |
            .build-tools/pyodide-venv
            .build-tools/pyodide-xbuildenv
          # the exact Python (the venv links to it) and the pins only, so an
          # edit elsewhere in the build script keeps the cache
          key: pyodide-toolchain-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('scripts/pyodide-toolchain.env', 'scripts/pyodide-build-requirements.txt') }}
      - name: Build the ViennaRNA Pyodide wheel
        run: |
          HYB2_PYTHON313="$(command -v python3.13 || command -v python3)" bash scripts/build-vienna-pyodide.sh

      - name: Build pinned browser CPLfold runtime
        run: |
          bash scripts/build-cplfold-web.sh
          test -s web/vendor/pyodide-cplfold/pyodide.mjs
          test -s web/vendor/pyodide-cplfold/pyodide.asm.wasm
          test -s web/vendor/pyodide-cplfold/numpy-2.2.5-cp313-cp313-pyemscripten_2025_0_wasm32.whl
          test -s web/vendor/pyodide-cplfold/CPLfold-THIRD_PARTY_NOTICES.md
          test -s web/vendor/pyodide-cplfold/CPLfold-GPL-3.0-or-later.txt
          test -s web/vendor/pyodide-cplfold/CPLfold-GPL-2.0-or-later.txt
          test -s web/vendor/pyodide-cplfold/CPLfold-LinearFold-LICENSE.txt

      - name: Version static assets for browser cache refresh
        run: |
          releases_hash=$(sha256sum web/releases.js | cut -d ' ' -f 1)
          sed -i "s#\./releases\.js\"#./releases.js?build=${releases_hash}\"#" web/index.html
          sed -i -E "s#(\./[^\"?]+\.(css|js))\"#\1?build=${GITHUB_SHA}\"#g" web/index.html
          # Module imports do not inherit the worker URL's build query.
          sed -i "s#\./support-kernels.js\"#./support-kernels.js?build=${GITHUB_SHA}\"#" web/cplfold.worker.mjs
          sed -i -E "s#(\./(support-kernels|iris-core|comrades-analysis)\.js)\"#\1?build=${GITHUB_SHA}\"#g" web/structure.worker.js
          grep -Fq "support-kernels.js?build=${GITHUB_SHA}" web/structure.worker.js
          grep -Fq "support-kernels.js?build=${GITHUB_SHA}" web/cplfold.worker.mjs
          grep -Fq "releases.js?build=${releases_hash}" web/index.html
          grep -q "app.js?build=${GITHUB_SHA}" web/index.html
          grep -q "styles.css?build=${GITHUB_SHA}" web/index.html

      - name: Verify the final site and shared source packaging contract
        run: |
          python3 -B -m unittest desktop.runtime.tests.test_native_release_preflight
          bash scripts/verify-browser-release.sh

      - name: Configure GitHub Pages
        if: ${{ (inputs.release_tag == github.ref_name && startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && vars.CPLFOLD_DISTRIBUTION_APPROVED == 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        id: pages-artifact
        if: ${{ (inputs.release_tag == github.ref_name && startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && vars.CPLFOLD_DISTRIBUTION_APPROVED == 'true' }}
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.site.outputs.name }}
          path: ./web
          retention-days: 1

      - name: Explain release gate
        if: ${{ vars.CPLFOLD_DISTRIBUTION_APPROVED != 'true' }}
        run: |
          echo "CPLfold browser build verified, but publishing is disabled." >> "$GITHUB_STEP_SUMMARY"
          echo "Set the repository Actions variable CPLFOLD_DISTRIBUTION_APPROVED=true only after redistribution permission or qualified licence review." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: ${{ github.ref == 'refs/heads/main' && vars.CPLFOLD_DISTRIBUTION_APPROVED == 'true' }}
    needs: [build, desktop]
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v6
      - name: Do not deploy a superseded main build
        run: |
          git fetch --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
      - name: Do not deploy a stale release catalog
        id: release-catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_CATALOG_SHA256: ${{ needs.build.outputs.release_catalog_sha256 }}
        run: node scripts/write-releases.mjs --check-main-deployment
      - name: Deploy the fully verified main build
        id: deployment
        if: steps.release-catalog.outputs.current == 'true'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact_name }}
      - name: Remove the temporary site after deployment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.pages_artifact_id }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
      - name: Explain stale catalog skip
        if: steps.release-catalog.outputs.current != 'true'
        run: echo "A newer desktop release changed the catalog after this site was built; the tag publisher owns the current Pages artifact." >> "$GITHUB_STEP_SUMMARY"
