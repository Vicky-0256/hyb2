name: Publish HYB2 Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  browser:
    # GitHub checks these against every job the called workflow declares, even
    # skipped ones; each called job still gets only its own permissions.
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      release_tag: ${{ github.ref_name }}
      browser_only: true

  package:
    uses: ./.github/workflows/desktop-release.yml
    with:
      release_installers: true

  publish:
    if: ${{ vars.CPLFOLD_DISTRIBUTION_APPROVED == 'true' }}
    needs: [browser, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify that the release commit is on main
        env:
          PAGES_ARTIFACT_ID: ${{ needs.browser.outputs.pages_artifact_id }}
        run: |
          test -n "$PAGES_ARTIFACT_ID"
          test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/build/write-releases.mjs --check-installers release
          cd release
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "HYB2 Desktop $GITHUB_REF_NAME" \
            --notes-file ../desktop/RELEASE_NOTES.md -- *
      - name: Remove temporary artifacts after publishing the release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "release-windows-x86_64" or .name == "release-linux-x86_64" or .name == "release-macos-aarch64") | .id')
          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done <<< "$artifact_ids"

  deploy:
    needs: [browser, publish]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.CPLFOLD_DISTRIBUTION_APPROVED == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v6
      - name: Do not replace a newer published version
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/build/write-releases.mjs --check-deployment
      - name: Promote the exact site verified before publication
        id: deployment
        if: steps.version.outputs.current == 'true'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.browser.outputs.pages_artifact_name }}
      - name: Remove the temporary site after promotion or supersession
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.browser.outputs.pages_artifact_id }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
