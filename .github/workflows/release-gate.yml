name: HYB2 Release Gate

on:
  push:
    branches:
      - CPLcofold
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - '.gitattributes'
      - 'bin/**'
      - 'web/**'
      - 'desktop/**'
      - 'pipeline/**'
      - 'requirements/**'
      - 'data/**'
      - 'scripts/**'
      - 'third_party/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  browser:
    name: Browser engines and contracts
    # GitHub checks these against every job the called workflow declares, even
    # skipped ones; each called job still gets only its own permissions.
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      browser_only: true

  native:
    name: Native desktop packages
    # PRs with desktop inputs and version tags have their own package job.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/CPLcofold'
    uses: ./.github/workflows/desktop-release.yml
