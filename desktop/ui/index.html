<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HYB2 Desktop</title>
  <link rel="stylesheet" href="./analysis/styles.css">
  <link rel="stylesheet" href="./analysis/workspace.css">
  <link rel="stylesheet" href="./analysis/analysis.css">
  <link rel="stylesheet" href="./analysis/structure.css">
  <link rel="stylesheet" href="./analysis/report.css">
  <link rel="stylesheet" href="./analysis/vendor/fornac/fornac.css">
  <link rel="stylesheet" href="./analysis/responsive.css">
  <link rel="stylesheet" href="./style.css">
  <!-- boot.js sets the analysis asset base, turns off the website auto-mount
       and applies the colour theme before anything renders. -->
  <script src="./boot.js"></script>
  <script src="./asset-status.js" defer></script>
  <script src="./analysis/desktop-adapter.js" defer></script>
  <script src="./analysis/vendor/d3/d3.v3.min.js" defer></script>
  <script src="./analysis/vendor/fornac/fornac.js" defer></script>
  <script src="./analysis/analysis-data.js" defer></script>
  <script src="./analysis/data-provider.js" defer></script>
  <script src="./analysis/page-data.js" defer></script>
  <script src="./analysis/comrades-analysis.js" defer></script>
  <script src="./analysis/analysis-pages.js" defer></script>
  <script src="./analysis/structure-controller.js" defer></script>
  <script src="./analysis/structure-ui.js" defer></script>
  <script src="./analysis/analysis-ui.js" defer></script>
  <script src="./analysis/overview-page.js" defer></script>
  <script src="./analysis/report-page.js" defer></script>
  <script src="./analysis/app.js" defer></script>
  <script src="./desktop-provider.js" defer></script>
  <script src="./core.js" defer></script>
  <script src="./arc-view.js" defer></script>
  <script src="./data-page.js" defer></script>
  <script src="./qc-page.js" defer></script>
  <script src="./workspace.js" defer></script>
  <script src="./compare-page.js" defer></script>
  <script src="./structure-page.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body class="d-body">
  <!-- Start screen: shown only while no project is open. -->
  <div id="d-start" class="d-start" hidden>
    <div class="d-start-inner">
      <div class="d-start-brand">
        <span class="d-logo" aria-hidden="true">H2</span>
        <div>
          <h1 class="d-start-title">HYB2 Desktop</h1>
          <p class="d-muted">From raw chimeric reads to RNA structure, in one local project.</p>
        </div>
      </div>
      <div class="d-start-grid">
        <section class="d-card">
          <h2 class="d-h2">Open a project</h2>
          <form id="d-open-form" class="d-form">
            <label class="d-label" for="d-open-path">Project folder</label>
            <div class="d-row">
              <input id="d-open-path" class="d-input" required placeholder="/path/to/study.hyb2proj" autocomplete="off" spellcheck="false">
              <button type="button" id="d-open-browse" class="d-btn">Browse…</button>
            </div>
            <div class="d-actions"><button class="d-btn d-btn-primary" type="submit">Open</button></div>
          </form>
        </section>
        <section class="d-card">
          <h2 class="d-h2">New project</h2>
          <form id="d-create-form" class="d-form">
            <label class="d-label" for="d-create-path">Empty folder</label>
            <div class="d-row">
              <input id="d-create-path" class="d-input" required placeholder="/path/to/new-study.hyb2proj" autocomplete="off" spellcheck="false">
              <button type="button" id="d-create-browse" class="d-btn">Browse…</button>
            </div>
            <label class="d-label" for="d-create-name">Name</label>
            <input id="d-create-name" class="d-input" required placeholder="ZIKV virion RNA" autocomplete="off">
            <div class="d-actions"><button class="d-btn d-btn-primary" type="submit">Create and open</button></div>
          </form>
        </section>
      </div>
      <section class="d-card">
        <h2 class="d-h2">Recent projects</h2>
        <p id="d-recent-empty" class="d-muted">No recent projects on this computer.</p>
        <ul id="d-recent-list" class="d-recent"></ul>
      </section>
      <p id="d-start-status" class="d-status-line" role="status" aria-live="polite"></p>
    </div>
  </div>

  <!-- Project shell: one top bar, one navigation. -->
  <div id="d-shell" class="d-shell" hidden>
    <header class="d-topbar">
      <div class="d-menu-anchor">
        <button type="button" id="d-project-button" class="d-top-button d-project-button" aria-haspopup="menu" aria-expanded="false">
          <span class="d-logo d-logo-small" aria-hidden="true">H2</span>
          <span id="d-project-name" class="d-project-name">Project</span>
          <span aria-hidden="true">▾</span>
        </button>
        <div id="d-project-menu" class="d-menu" role="menu" hidden></div>
      </div>
      <div class="d-top-field">
        <label for="d-reference">Reference</label>
        <select id="d-reference" class="d-select d-select-top"></select>
      </div>
      <div class="d-top-field">
        <label for="d-gene">Gene</label>
        <select id="d-gene" class="d-select d-select-top d-select-gene"></select>
      </div>
      <div class="d-top-field d-top-selection">
        <label for="d-selection">Selection</label>
        <select id="d-selection" class="d-select d-select-top"></select>
      </div>
      <span class="d-top-spacer"></span>
      <button type="button" id="d-task-indicator" class="d-top-button d-task-indicator" aria-controls="d-drawer" aria-expanded="false">
        <span id="d-task-indicator-text">No tasks</span>
        <span class="d-mini-bar" aria-hidden="true"><span id="d-task-indicator-bar"></span></span>
      </button>
      <div class="d-menu-anchor">
        <button type="button" id="d-help-button" class="d-top-button" aria-haspopup="menu" aria-expanded="false">Help ▾</button>
        <div id="d-help-menu" class="d-menu d-menu-right" role="menu" hidden>
          <button type="button" class="d-menu-item" role="menuitem" data-help="workflow">Workflow guide</button>
          <button type="button" class="d-menu-item" role="menuitem" data-help="methods">Methods</button>
          <button type="button" class="d-menu-item" role="menuitem" data-help="file-format">File format</button>
          <button type="button" class="d-menu-item" role="menuitem" data-help="validation">Validation of the selection</button>
        </div>
      </div>
      <button type="button" id="d-prefs-button" class="d-top-button" title="Preferences">Preferences</button>
    </header>
    <div class="d-layout">
      <nav class="d-nav" aria-label="Project">
        <button type="button" class="d-nav-item" data-page="data"><span class="d-nav-num">1</span><span>Data</span></button>
        <button type="button" class="d-nav-item" data-page="qc"><span class="d-nav-num">2</span><span>QC</span></button>
        <button type="button" class="d-nav-item" data-page="explore"><span class="d-nav-num">3</span><span>Explore</span></button>
        <button type="button" class="d-nav-item" data-page="compare"><span class="d-nav-num">4</span><span>Compare</span></button>
        <button type="button" class="d-nav-item" data-page="structure"><span class="d-nav-num">5</span><span>Structure</span></button>
        <button type="button" class="d-nav-item" data-page="report"><span class="d-nav-num">6</span><span>Report</span></button>
      </nav>
      <main class="d-main">
        <section class="d-page" data-page="data" id="d-page-data"></section>
        <section class="d-page" data-page="qc" id="d-page-qc"></section>
        <section class="d-page" data-page="explore" id="d-page-explore"></section>
        <section class="d-page" data-page="compare" id="d-page-compare"></section>
        <section class="d-page" data-page="structure" id="d-page-structure"></section>
        <section class="d-page" data-page="report" id="d-page-report"></section>
      </main>
    </div>
    <aside id="d-drawer" class="d-drawer" aria-label="Tasks" hidden>
      <div class="d-drawer-head">
        <h2 class="d-h2">Tasks</h2>
        <button type="button" id="d-drawer-close" class="d-btn d-btn-small">Close</button>
      </div>
      <div id="d-drawer-body" class="d-drawer-body"></div>
    </aside>
  </div>
  <dialog id="d-dialog" class="d-dialog"></dialog>
  <div id="d-toast" class="d-toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
